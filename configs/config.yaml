# ScholarLens configuration.
# Every script and notebook reads from this file so experiments stay comparable.
# Change values here, not inside the scripts. CLI flags (e.g. --train-samples)
# can override a value for a quick test without editing this file.

seed: 42

paths:
  data_dir: "data"          # downloaded raw data (ignored by git)
  output_dir: "outputs"     # model checkpoints (ignored by git). On Colab, point to Google Drive.
  results_dir: "results"    # metrics JSON, prediction samples, plots (committed to git)

# Default training hyperparameters. Each task can override any of these in its
# own `training:` block, and each model can override again in `model_overrides:`.
training:
  learning_rate: 5.0e-5
  batch_size: 8
  grad_accum_steps: 1
  epochs: 3
  weight_decay: 0.01
  warmup_ratio: 0.06
  fp16: true                # automatically disabled on CPU and for T5 models (fp16 overflow)
  logging_steps: 50

# ---------------------------------------------------------------- Summarization
summarization:
  dataset: "ccdv/arxiv-summarization"   # long scientific papers + their abstracts
  train_samples: 10000                  # 10k papers ~ 2M sentences (rubric needs >= 50k)
  val_samples: 300                      # used for validation loss / best checkpoint
  test_samples: 1000                    # final ROUGE / BERTScore numbers
  max_input_tokens: 1024
  max_target_tokens: 256
  t5_prefix: "summarize: "
  generation:
    num_beams: 4
    max_new_tokens: 256
    min_new_tokens: 50
    length_penalty: 2.0
    no_repeat_ngram_size: 3
  models:
    - "facebook/bart-base"
    - "t5-small"
  training:
    epochs: 2
    batch_size: 4
    grad_accum_steps: 2     # effective batch size 8
  model_overrides:
    "t5-small":
      learning_rate: 3.0e-4 # T5 is usually trained with a higher learning rate than BART

# --------------------------------------------------------------------------- QA
qa:
  dataset: "rajpurkar/squad_v2"         # 130k questions, ~50% unanswerable
  train_samples: 40000
  tune_fraction: 0.05                   # held out from train: checkpoint + no-answer threshold selection
  test_samples: null                    # null = full official dev set (11,873), used ONCE as the test set
  max_seq_len: 384
  doc_stride: 128
  max_answer_tokens: 30
  n_best: 20
  models:
    - "distilbert-base-uncased"
    - "roberta-base"
  training:
    epochs: 2
    batch_size: 16
    learning_rate: 3.0e-5

retrieval:
  models:
    - "sentence-transformers/all-MiniLM-L6-v2"   # dense retriever
    - "tfidf"                                     # sparse baseline
  top_k_passages: 3
  passage_max_words: 120
  passage_overlap_sentences: 1

# -------------------------------------------------------------------------- NER
ner:
  # SciERC (Luan et al., 2018): 500 AI abstracts, entity types Task, Method,
  # Metric, Material, OtherScientificTerm, Generic. Downloaded from the authors'
  # site and converted to BIO tags by src/data_loading.py.
  processed_url: "https://nlp.cs.washington.edu/sciIE/data/sciERC_processed.tar.gz"
  raw_url: "https://nlp.cs.washington.edu/sciIE/data/sciERC_raw.tar.gz"
  local_dir: "data/scierc"              # put train.json/dev.json/test.json here to skip the download
  max_seq_len: 256
  models:
    - "allenai/scibert_scivocab_uncased"
    - "bert-base-uncased"
  training:
    epochs: 10              # small dataset (~1.9k training sentences), so more epochs
    batch_size: 16

# ------------------------------------------------------------------------- Demo
demo:
  # Fine-tuned checkpoints, relative to paths.output_dir (so on Colab they point to
  # Google Drive automatically). Set these to your BEST model of each pair after
  # training. A Hugging Face Hub ID ("user/model") also works. If a checkpoint is
  # missing, the app falls back to a base model and shows a warning.
  summarization_model: "summarization/facebook__bart-base/best"
  qa_model: "qa/roberta-base/best"
  ner_model: "ner/allenai__scibert_scivocab_uncased/best"
  retriever_model: "sentence-transformers/all-MiniLM-L6-v2"
  summary_strategy: "chunked"           # "truncate" (first 1024 tokens) or "chunked" (summarize sections, then combine)
  max_ner_sentences: 200
